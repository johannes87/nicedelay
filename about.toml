# cargo-about: the licences of the crates compiled into nicedelay (see scripts/third-party-licenses.sh).
accepted = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "BSL-1.0",
    "CC0-1.0",
    "OFL-1.1",
    "Unlicense",
    "0BSD",
    "WTFPL",
    "Ubuntu-font-1.0",
    # file-level copyleft: the file names where to get the source (crates.io)
    "MPL-2.0",
]
targets = ["aarch64-apple-darwin", "x86_64-apple-darwin", "x86_64-pc-windows-msvc", "x86_64-unknown-linux-gnu"]
ignore-build-dependencies = true
ignore-dev-dependencies = true
